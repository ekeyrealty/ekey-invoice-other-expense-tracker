[data-mode=night]{
  --hl:rgba(255,255,255,.07);--hl2:rgba(255,255,255,.03);
  --e1:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.3),0 6px 14px -6px rgba(0,0,0,.45);
  --e2:inset 0 1px 0 var(--hl),0 1px 2px rgba(0,0,0,.3),0 12px 24px -10px rgba(0,0,0,.55),0 30px 50px -28px rgba(0,0,0,.6);
  --e3:inset 0 1px 0 var(--hl),0 2px 6px rgba(0,0,0,.4),0 24px 48px -16px rgba(0,0,0,.65),0 60px 90px -40px rgba(0,0,0,.7);
  --in:inset 0 2px 5px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.03),0 1px 0 var(--hl);
  color-scheme:dark;
}

/* ========================= base ========================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-ui);color:var(--ink);background:var(--g1);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
::selection{background:color-mix(in srgb,var(--acc2) 35%,transparent)}
#shader{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block}
.bgfallback{position:fixed;inset:0;z-index:0;background:radial-gradient(1200px 800px at 20% 10%,var(--g3),transparent 60%),radial-gradient(900px 700px at 90% 90%,var(--g4),transparent 60%),linear-gradient(140deg,var(--g1),var(--g2))}
.svg-ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ======================= window shell ===================== */
.stage{position:relative;z-index:1;height:100vh;padding:26px;display:flex}
.win{flex:1;min-width:0;display:grid;grid-template-columns:236px minmax(0,1fr);border-radius:var(--r-xl);
  background:radial-gradient(1400px 600px at 70% -10%,var(--card-hi),transparent 60%),linear-gradient(180deg,var(--paper),var(--paper2));
  box-shadow:inset 0 1px 0 var(--hl),0 2px 4px rgba(0,0,0,.08),0 40px 80px -30px rgba(0,0,0,.45),0 80px 140px -60px rgba(var(--sh),.6);
  overflow:hidden;position:relative;animation:winIn .9s var(--ease) both}
@keyframes winIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.win::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background-image:radial-gradient(rgba(var(--sh),.07) 1px,transparent 1.2px);background-size:22px 22px;opacity:.5;mask:linear-gradient(180deg,#000,transparent 70%)}

/* sidebar */
.side{position:relative;margin:10px 0 10px 10px;border-radius:22px;padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto;
  background:linear-gradient(180deg,var(--side2),var(--side));color:var(--side-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -18px rgba(0,0,0,.5);scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:4px 10px 16px}
.brand img{width:150px;height:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand small{display:block;font:10px var(--f-mono);color:var(--side-ink2);letter-spacing:.14em;text-transform:uppercase}
.brand-orb{width:34px;height:34px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 34% 28%,#fff9 0 6%,var(--acc2) 28%,color-mix(in srgb,var(--acc2),#000 55%) 100%);
  box-shadow:0 6px 14px -4px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.25);display:grid;place-items:center;color:#fff8ef;font-size:15px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:27px;letter-spacing:-.01em;line-height:1}
.brand sup{color:var(--acc2);font-size:15px}
.brand small{display:block;font:10px var(--f-mono);color:var(--side-ink2);letter-spacing:.06em;margin-top:2px}
.nav-label{font:500 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink2);padding:14px 10px 6px;opacity:.8}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:13px;color:var(--side-ink2);font-weight:600;font-size:13.5px;transition:background .25s,color .25s,transform .25s var(--spring);position:relative;text-align:left;width:100%}
.nav:hover{color:var(--side-ink);background:rgba(255,255,255,.04)}
.nav.on{color:var(--side-ink);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 14px -8px rgba(0,0,0,.6)}
.nav.on .svg-ic{color:var(--acc2)}
.nav .count{margin-left:auto;font:500 10.5px var(--f-mono);padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--side-ink)}
.nav .count.hot{background:var(--acc2);color:#fff8f0;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 25%,transparent)}
.nav.month{font-weight:500;font-size:12.5px;padding:6px 10px}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.whochip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;color:var(--acc-ink);
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--acc2),#fff 35%),var(--acc2) 55%,color-mix(in srgb,var(--acc2),#000 35%));box-shadow:0 4px 10px -3px rgba(0,0,0,.45),inset 0 -2px 4px rgba(0,0,0,.2)}
.whochip select{background:transparent;border:0;color:var(--side-ink);font-weight:700;font-size:13px;outline:none;width:100%;cursor:pointer}
.whochip select option{color:#222}
.whochip small{display:block;font:10px var(--f-mono);color:var(--side-ink2)}

/* main column */
.main{min-width:0;overflow:auto;position:relative;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink3) 50%,transparent) transparent}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:16px 30px 12px;
  background:linear-gradient(180deg,var(--paper) 55%,color-mix(in srgb,var(--paper) 0%,transparent));backdrop-filter:blur(6px)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;background:var(--sunk);box-shadow:var(--in);color:var(--ink3);font-size:13px;text-align:left}
.search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.search{min-width:220px}
.search kbd{white-space:nowrap;flex:none;margin-left:auto;font:500 10.5px var(--f-mono);padding:2px 7px;border-radius:7px;background:var(--card);box-shadow:var(--e1);color:var(--ink2)}
.top-sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--ink2);background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e1);position:relative;transition:transform .2s var(--spring),color .2s}
.iconbtn:hover{color:var(--ink);transform:translateY(-1px)}
.iconbtn:active{transform:translateY(1px);box-shadow:var(--in)}
.iconbtn .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;font:600 10px/18px var(--f-mono);color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bad),#fff 30%),var(--bad));box-shadow:0 3px 8px -2px rgba(var(--sh),.5)}
.iconbtn .dot.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.savepill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;font:600 11.5px var(--f-ui);color:var(--good);background:var(--good-bg);box-shadow:var(--e1)}
.savepill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent)}
.savepill.syncing{color:var(--warn);background:var(--warn-bg)}
.savepill.syncing i{animation:blink 1s infinite}
.savepill.err{color:var(--bad);background:var(--bad-bg)}
@keyframes blink{50%{opacity:.25}}
.demo-pill{position:relative;flex:none;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:99px;font-size:12px;font-weight:600;color:var(--acc-ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--acc2),#fff 12%),var(--acc2));box-shadow:0 10px 24px -10px rgba(var(--sh),.6),inset 0 1px 0 rgba(255,255,255,.3);white-space:nowrap}
.demo-pill button{padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.25);color:#fff;font-weight:700;font-size:11.5px}

.page{padding:4px 30px 60px;animation:pageIn .55s var(--ease) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kicker{display:inline-block;font:500 10.5px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);padding:4px 10px;border-radius:8px;background:var(--card);box-shadow:var(--e1)}
.h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,4.4vw,58px);line-height:.98;letter-spacing:-.02em;margin:12px 0 6px}
.h1 em{font-style:italic;color:var(--acc2)}
.h1 sup{color:var(--acc2);font-size:.45em}
.sub{color:var(--ink2);max-width:640px;margin:0}
.page-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:6px 0 22px}
.page-head .grow{flex:1;min-width:280px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ======================= surfaces ======================== */
.card{position:relative;border-radius:var(--r-lg);padding:20px;background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e2);min-width:0}
.card.flat{box-shadow:var(--e1)}
.card.sunk{background:var(--sunk);box-shadow:var(--in)}
.card h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card h3 .hint{font:500 10.5px var(--f-mono);color:var(--ink3);font-weight:400}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-head .sp{flex:1}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:1.15fr 1fr 1fr}
.g-2{grid-template-columns:1.6fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
.mt{margin-top:18px}

/* KPI tiles — pastel, tactile, tilting */
.tile{position:relative;border-radius:var(--r-lg);padding:18px 18px 16px;background:var(--tbg);color:var(--ink);min-height:158px;display:flex;flex-direction:column;
  box-shadow:inset 0 1px 0 var(--hl),inset 0 -12px 24px -14px rgba(var(--sh),.12),0 2px 3px rgba(var(--sh),.06),0 18px 30px -16px rgba(var(--sh),.32);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .45s var(--ease),box-shadow .45s;transform-style:preserve-3d;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px 160px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.35),transparent 70%);opacity:.7;mix-blend-mode:soft-light}
[data-mode=night] .tile::after{opacity:.25}
.tile:hover{box-shadow:inset 0 1px 0 var(--hl),0 4px 6px rgba(var(--sh),.08),0 28px 40px -18px rgba(var(--sh),.42)}
.tile .glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--ti);font-size:16px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.15));box-shadow:0 4px 10px -4px rgba(var(--sh),.3),inset 0 1px 0 rgba(255,255,255,.7)}
[data-mode=night] .tile .glyph{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 4px 10px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.tile .lbl{font-size:12.5px;color:var(--ink2);margin-top:12px;font-weight:600}
.tile .big{font-family:var(--f-display);font-size:clamp(30px,2.6vw,40px);line-height:1;letter-spacing:-.02em;margin-top:2px}
.tile .foot{font-size:11.5px;color:var(--ink2);margin-top:4px}
.tile .chip-tr{position:absolute;top:16px;right:16px}
.spark{display:flex;align-items:flex-end;gap:4px;height:26px;margin-top:auto;padding-top:10px}
.spark i{flex:1;border-radius:4px;background:color-mix(in srgb,var(--ti) 28%,transparent);min-height:3px;transition:height .8s var(--ease)}
.spark i:last-child{background:var(--ti);box-shadow:0 3px 8px -2px color-mix(in srgb,var(--ti) 60%,transparent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font:700 11px var(--f-ui);white-space:nowrap;background:var(--sunk);color:var(--ink2);box-shadow:inset 0 1px 0 var(--hl2)}
.chip i.d{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.ink{background:var(--ink);color:var(--paper)}
.chip.part{background:var(--t3);color:var(--t3i)}
.chip.sys{background:color-mix(in srgb,var(--acc3) 14%,var(--card));color:color-mix(in srgb,var(--acc3),var(--ink) 25%);font-weight:600}
button.chip{cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s}
button.chip:hover{transform:translateY(-1px);box-shadow:0 6px 12px -6px rgba(var(--sh),.4)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;white-space:nowrap;
  background:linear-gradient(180deg,var(--card-hi),var(--card));color:var(--ink);box-shadow:var(--e1);transition:transform .2s var(--spring),box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--e2)}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:var(--in)}
.btn.primary{color:var(--acc-ink);background:linear-gradient(180deg,color-mix(in srgb,var(--acc),#fff 14%),var(--acc));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 4px rgba(0,0,0,.18),0 10px 20px -10px color-mix(in srgb,var(--acc) 80%,#000),0 2px 4px rgba(var(--sh),.15)}
.btn.warm{color:#fff8f0;background:linear-gradient(180deg,color-mix(in srgb,var(--acc2),#fff 14%),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.15),0 10px 20px -10px var(--acc2)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad);background:var(--bad-bg)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:11px}
.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:9px;gap:5px}
.btn .svg-ic{width:16px;height:16px}

/* segmented & tabs */
.seg{display:inline-flex;padding:4px;border-radius:14px;background:var(--sunk);box-shadow:var(--in);gap:2px;flex-wrap:wrap}
.seg button{padding:7px 13px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px;transition:all .25s var(--ease)}
.seg button .n{font:500 10.5px var(--f-mono);opacity:.75}
.seg button.on{color:var(--ink);background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e1)}
.seg button.on.s-warn{color:var(--warn)} .seg button.on.s-good{color:var(--good)} .seg button.on.s-bad{color:var(--bad)} .seg button.on.s-info{color:var(--info)}

/* form fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.inp,.field input,.field select,.field textarea,select.inp{width:100%;border:0;outline:none;padding:11px 13px;border-radius:13px;background:var(--sunk);box-shadow:var(--in);font-size:13.5px;transition:box-shadow .2s,background .2s}
.field textarea{resize:vertical;min-height:74px}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{box-shadow:var(--in),0 0 0 3px color-mix(in srgb,var(--acc2) 30%,transparent)}
.money-in{position:relative}
.money-in b{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-weight:600}
.money-in input{padding-left:26px;font-variant-numeric:tabular-nums;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.select-sm{padding:8px 12px;border-radius:12px;font-weight:600;font-size:12.5px}

/* switch — glossy 3D knob */
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:var(--sunk);box-shadow:var(--in);flex:none;transition:background .3s;cursor:pointer;display:inline-block;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 20%,#f1ece6 55%,#cfc6bd 100%);box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 -1px 2px rgba(0,0,0,.1);transition:transform .35s var(--spring)}
.sw.on{background:linear-gradient(180deg,color-mix(in srgb,var(--good),#fff 10%),var(--good));box-shadow:inset 0 2px 4px rgba(0,0,0,.2)}
.sw.on::after{transform:translateX(18px)}
.sw.acc.on{background:linear-gradient(180deg,color-mix(in srgb,var(--acc2),#fff 10%),var(--acc2))}

/* ========================= tables ======================== */
.tbl-wrap{overflow:auto;margin:0 -6px;padding:0 6px 6px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:13px;min-width:1120px}
.tbl th{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:4px 12px 2px;white-space:nowrap;cursor:pointer;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th .ar{opacity:.6}
.tbl td{padding:11px 12px;background:var(--card);vertical-align:middle;white-space:nowrap;transition:background .2s}
.tbl tbody tr{transition:transform .3s var(--ease),filter .3s}
.tbl tbody tr td:first-child{border-radius:14px 0 0 14px}
.tbl tbody tr td:last-child{border-radius:0 14px 14px 0}
.tbl tbody tr{filter:drop-shadow(0 1px 1px rgba(var(--sh),.05)) drop-shadow(0 4px 8px rgba(var(--sh),.04))}
.tbl tbody tr:hover td{background:var(--card-hi)}
.tbl tbody tr:hover{transform:translateY(-1px);filter:drop-shadow(0 8px 14px rgba(var(--sh),.13))}
.tbl tbody tr.flash td{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,30%{background:color-mix(in srgb,var(--acc2) 22%,var(--card))}}
.tbl tfoot td{padding:12px;font-weight:800;background:transparent}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:600}
.tbl .client{font-weight:700;display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.tbl .addr{font-size:11.5px;color:var(--ink3);display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--good)} .neg{color:var(--bad)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.rowact button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink3);transition:all .2s}
.rowact button:hover{color:var(--ink);background:var(--sunk)}
.rowact .svg-ic{width:15px;height:15px}
.empty{text-align:center;padding:46px 20px;color:var(--ink2)}
.empty .orb{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:var(--acc2);background:radial-gradient(circle at 35% 30%,var(--card-hi),var(--sunk));box-shadow:var(--e2)}
.empty h4{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 4px;color:var(--ink)}

/* ======================= stickers / decor ================ */
.hand{font-family:var(--f-hand);color:var(--hand);font-size:17px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;position:absolute;pointer-events:none;z-index:4;white-space:nowrap}
.hand svg{display:block;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.pin{position:absolute;width:22px;height:22px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 9%,var(--pc,var(--acc2)) 34%,color-mix(in srgb,var(--pc,var(--acc2)),#000 50%) 100%);
  box-shadow:5px 9px 8px -3px rgba(0,0,0,.35),inset -2px -3px 5px rgba(0,0,0,.22)}
.pin::after{content:"";position:absolute;left:12px;top:17px;width:2px;height:9px;border-radius:2px;background:linear-gradient(#ddd,#888);transform:rotate(-24deg);transform-origin:top;z-index:-1;filter:blur(.2px)}
.pin.gold{--pc:#C8A35C}
.tape{position:absolute;width:96px;height:28px;z-index:6;background:color-mix(in srgb,var(--tc,var(--t3i)) 32%,rgba(255,255,255,.35));
  -webkit-mask:conic-gradient(from 135deg at left,#0000,#000 1deg 89deg,#0000 90deg) left/6px 8px repeat-y,conic-gradient(from -45deg at right,#0000,#000 1deg 89deg,#0000 90deg) right/6px 8px repeat-y,linear-gradient(#000 0 0) center/calc(100% - 10px) 100% no-repeat;
  mask:conic-gradient(from 135deg at left,#0000,#000 1deg 89deg,#0000 90deg) left/6px 8px repeat-y,conic-gradient(from -45deg at right,#0000,#000 1deg 89deg,#0000 90deg) right/6px 8px repeat-y,linear-gradient(#000 0 0) center/calc(100% - 10px) 100% no-repeat;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));backdrop-filter:blur(1px)}
.tape::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.clip{position:absolute;width:26px;height:74px;z-index:7;filter:drop-shadow(2px 5px 4px rgba(0,0,0,.28))}
.spiral{position:absolute;left:18px;right:18px;top:-13px;height:28px;z-index:6;display:flex;justify-content:space-between;pointer-events:none}
.spiral i{width:13px;height:28px;border-radius:7px;background:linear-gradient(90deg,#8b8580,#f4f1ec 35%,#bdb7b0 60%,#6f6a65);box-shadow:1px 3px 4px rgba(0,0,0,.25)}
.spiral i::after{content:"";display:block;width:7px;height:7px;border-radius:50%;margin:19px auto 0;background:var(--paper2);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.stamp{position:absolute;padding:6px 14px;border-radius:12px;font:800 20px var(--f-ui);letter-spacing:.2em;transform:rotate(-12deg);pointer-events:none;
  color:color-mix(in srgb,var(--good) 85%,transparent);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--good) 70%,transparent),inset 0 0 0 6px transparent,inset 0 0 0 7px color-mix(in srgb,var(--good) 45%,transparent);mix-blend-mode:multiply;opacity:.85}
[data-mode=night] .stamp{mix-blend-mode:screen}
.receipt{position:relative;padding:20px 20px 30px;background:linear-gradient(180deg,var(--card-hi),var(--card));
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/18px 10px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/18px 10px repeat-x;border-radius:18px 18px 0 0}
.receipt-wrap{filter:drop-shadow(0 12px 16px rgba(var(--sh),.18)) drop-shadow(0 2px 2px rgba(var(--sh),.08));position:relative}
.rline{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:13.5px}
.rline.tot{font-weight:800;font-size:15px;padding-top:12px;margin-top:6px;background:radial-gradient(circle,rgba(var(--sh),.25) 1px,transparent 1.4px) top/8px 2px repeat-x}
.rline.tot b{font-family:var(--f-display);font-weight:400;font-size:30px}

/* ======================= dashboard bits ================== */
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--e1);transition:transform .3s var(--ease)}
.alert-item+.alert-item{margin-top:8px}
.alert-item:hover{transform:translateX(3px)}
.alert-item .ai-ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:15px}
.ai-ic.warn{background:var(--warn-bg);color:var(--warn)} .ai-ic.bad{background:var(--bad-bg);color:var(--bad)} .ai-ic.info{background:var(--info-bg);color:var(--info)} .ai-ic.good{background:var(--good-bg);color:var(--good)}
.alert-item .t{font-weight:700;font-size:13px}
.alert-item .b{font-size:12px;color:var(--ink2);margin-top:1px}
.alert-item .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.scroller{max-height:330px;overflow:auto;margin:-6px;padding:6px;scrollbar-width:thin}
.up-item{display:flex;align-items:center;gap:12px;padding:10px 4px}
.up-item+.up-item{background:radial-gradient(circle,rgba(var(--sh),.18) 1px,transparent 1.4px) top/7px 2px repeat-x}
.datebox{width:42px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e1)}
.datebox b{font-family:var(--f-display);font-size:21px;line-height:1;font-weight:400}
.datebox small{font:500 9px var(--f-mono);text-transform:uppercase;color:var(--acc2);letter-spacing:.08em}
.ring-wrap{display:grid;place-items:center;position:relative}
.ring-wrap .center{position:absolute;text-align:center}
.ring-wrap .center b{font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1;display:block}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{padding:12px;border-radius:14px;background:var(--sunk);box-shadow:var(--in)}
.mini b{font-family:var(--f-display);font-size:24px;font-weight:400;display:block;line-height:1.05}
.mini small{font-size:11px;color:var(--ink2)}
.pipe{display:flex;flex-direction:column;gap:12px}
.pipe-row .top-l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.pipe-row .top-l b{font-variant-numeric:tabular-nums}
.bar3d{height:16px;border-radius:99px;background:var(--sunk);box-shadow:var(--in);overflow:hidden;position:relative}
.bar3d i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--bc),#fff 30%),var(--bc) 55%,color-mix(in srgb,var(--bc),#000 15%));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px -2px var(--bc);transition:width 1s var(--ease)}
.bar3d .mark{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:3px;background:var(--ink);opacity:.55}
.feed-item{display:flex;gap:10px;padding:8px 0;font-size:12.5px}
.feed-item .fd{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--fc,var(--acc2));box-shadow:0 0 0 4px color-mix(in srgb,var(--fc,var(--acc2)) 18%,transparent)}
.feed-item time{display:block;font:10.5px var(--f-mono);color:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lb-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.lb-row .rk{font:500 11px var(--f-mono);color:var(--ink3)}
.lb-row .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .bar3d{height:8px;margin-top:5px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .dow{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);text-align:center;padding-bottom:2px}
.cal .day{min-height:108px;border-radius:16px;padding:8px;background:var(--card);box-shadow:var(--e1);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .3s var(--spring),box-shadow .3s;text-align:left;overflow:hidden}
.cal .day:hover{transform:translateY(-2px);box-shadow:var(--e2)}
.cal .day.out{opacity:.38;box-shadow:none;background:var(--sunk)}
.cal .day.today{box-shadow:var(--e2),inset 0 0 0 2px var(--acc2)}
.cal .day .dn{font-family:var(--f-display);font-size:20px;line-height:1}
.cal .day.today .dn{color:var(--acc2)}
.ev{display:block;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--evb);color:var(--evc)}
.ev.logged{--evb:var(--t1);--evc:var(--t1i)} .ev.expected{--evb:var(--warn-bg);--evc:var(--warn)} .ev.paid{--evb:var(--good-bg);--evc:var(--good)} .ev.rem{--evb:var(--t3);--evc:var(--t3i)} .ev.over{--evb:var(--bad-bg);--evc:var(--bad)} .ev.done{opacity:.5;text-decoration:line-through}
.ev.more{background:transparent;color:var(--ink3)}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.minical .dw{font:500 9px var(--f-mono);color:var(--ink3)}
.minical button{aspect-ratio:1;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--ink2);position:relative;transition:transform .2s var(--spring)}
.minical button:hover{transform:scale(1.12);background:var(--sunk)}
.minical button.has{background:var(--t1);color:var(--t1i);box-shadow:0 3px 6px -3px rgba(var(--sh),.35)}
.minical button.pay{background:var(--good-bg);color:var(--good)}
.minical button.rem{background:var(--t3);color:var(--t3i)}
.minical button.today{box-shadow:inset 0 0 0 2px var(--acc2);color:var(--acc2)}
.minical button.out{opacity:0;pointer-events:none}

/* theme gallery */
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.theme-card{border-radius:18px;padding:12px;text-align:left;background:var(--sunk);box-shadow:var(--in);transition:transform .3s var(--spring)}
.theme-card:hover{transform:translateY(-2px)}
.theme-card.on{background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e2),inset 0 0 0 2px var(--acc2)}
.theme-card .sw5{display:flex;height:38px;border-radius:12px;overflow:hidden;box-shadow:0 6px 12px -6px rgba(0,0,0,.35)}
.theme-card .sw5 i{flex:1}
.theme-card b{display:block;margin-top:9px;font-size:13px}
.theme-card small{font-size:11px;color:var(--ink2)}

/* settings */
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0}
.set-row+.set-row{background:radial-gradient(circle,rgba(var(--sh),.16) 1px,transparent 1.4px) top/7px 2px repeat-x}
.set-row .txt{flex:1;min-width:0}
.set-row .txt b{display:block;font-size:13.5px}
.set-row .txt small{color:var(--ink2);font-size:12px}
.stepper{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:var(--sunk);box-shadow:var(--in)}
.stepper button{width:28px;height:28px;border-radius:9px;font-weight:800;color:var(--ink2)}
.stepper button:hover{background:var(--card);box-shadow:var(--e1);color:var(--ink)}
.stepper input{width:54px;text-align:center;border:0;background:transparent;font-weight:800;outline:none;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--card);box-shadow:var(--e1)}
.tag button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:12px}
.tag button:hover{background:var(--bad-bg);color:var(--bad)}
pre.code{background:var(--side);color:var(--side-ink);padding:16px;border-radius:16px;font:12px/1.55 var(--f-mono);overflow:auto;max-height:340px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}

/* ===================== overlays =========================== */
.scrim{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(var(--sh),.28);backdrop-filter:blur(10px) saturate(1.1);animation:fade .3s var(--ease)}
[data-mode=night] .scrim{background:rgba(0,0,0,.5)}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:28px;padding:26px;background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e3);animation:pop .45s var(--spring);scrollbar-width:thin}
.modal.wide{width:min(940px,100%)}
.modal.narrow{width:min(460px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.modal-head h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;margin:6px 0 0;letter-spacing:-.01em}
.modal-head .x{margin-left:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;align-items:center}
.modal-foot .sp{flex:1}
.inv-form{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}
.preview{position:sticky;top:0;align-self:start}
.drawer{position:fixed;z-index:90;top:14px;right:14px;bottom:14px;width:min(460px,calc(100vw - 28px));border-radius:28px;overflow:auto;padding:24px;
  background:linear-gradient(180deg,var(--card-hi),var(--paper));box-shadow:var(--e3);animation:slideIn .5s var(--ease);scrollbar-width:thin}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}}
.drawer.out{animation:slideOut .3s var(--ease) forwards}
@keyframes slideOut{to{transform:translateX(40px);opacity:0}}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc2) 45%,transparent),transparent)}
.tl{position:relative;padding:6px 0 10px}
.tl::before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--tlc,var(--acc2)),0 2px 4px rgba(var(--sh),.2)}
.tl.sys{--tlc:var(--ink3)}
.tl b{font-size:12.5px}
.tl time{font:10.5px var(--f-mono);color:var(--ink3);margin-left:6px}
.tl p{margin:2px 0 0;font-size:12.5px;color:var(--ink2);white-space:pre-wrap}
.pop{position:fixed;z-index:95;width:340px;border-radius:22px;padding:16px;background:linear-gradient(180deg,var(--card-hi),var(--card));box-shadow:var(--e3);animation:pop .35s var(--spring)}
.cmd{width:min(620px,100%);padding:10px;align-self:start;margin-top:10vh}
.cmd input{width:100%;border:0;outline:none;background:transparent;font-size:18px;padding:14px 14px 12px;font-weight:600}
.cmd-list{max-height:52vh;overflow:auto}
.cmd-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;text-align:left;font-weight:600;font-size:13.5px;color:var(--ink2)}
.cmd-item .k{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--ink3)}
.cmd-item.on{background:var(--sunk);color:var(--ink);box-shadow:var(--in)}
.cmd-sec{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding:10px 14px 4px}

/* toasts — live notifications */
.toasts{position:fixed;z-index:200;right:22px;bottom:22px;display:flex;flex-direction:column-reverse;gap:10px;width:min(370px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;position:relative;display:flex;gap:12px;padding:14px 14px 16px;border-radius:20px;overflow:hidden;
  background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(16px) saturate(1.3);box-shadow:var(--e3);animation:toastIn .6s var(--spring)}
.toast.bye{animation:toastOut .35s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9) rotate(-1deg)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px) scale(.95)}}
.toast .ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:17px;color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc),#fff 35%),var(--tc) 60%,color-mix(in srgb,var(--tc),#000 25%));box-shadow:0 6px 14px -6px var(--tc),inset 0 -2px 4px rgba(0,0,0,.18)}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.toast .tacts{display:flex;gap:6px;margin-top:8px}
.toast .tx{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--ink3)}
.toast .prog{position:absolute;left:14px;right:14px;bottom:6px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--tc) 18%,transparent);overflow:hidden}
.toast .prog i{display:block;height:100%;border-radius:3px;background:var(--tc);transform-origin:left;animation:prog linear forwards}
@keyframes prog{to{transform:scaleX(0)}}
.tip{position:fixed;z-index:300;pointer-events:none;padding:7px 11px;border-radius:11px;font-size:12px;font-weight:600;background:var(--ink);color:var(--paper);box-shadow:0 10px 24px -8px rgba(0,0,0,.4);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.burst{position:fixed;z-index:400;pointer-events:none;font-size:16px;color:var(--acc2);animation:burst 1s var(--ease) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg);opacity:0}}
.svgchart text{font:10.5px var(--f-mono);fill:var(--ink3)}
.svgchart .bar{transition:opacity .2s}
.svgchart .bar:hover{opacity:.82}
.pgrow{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;align-items:center;padding:12px 0}
.pgrow+.pgrow{background:radial-gradient(circle,rgba(var(--sh),.16) 1px,transparent 1.4px) top/7px 2px repeat-x}
.pgrow .nm{display:flex;align-items:center;gap:10px;font-weight:700}
.pgrow .nm .ai-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.pgrow .rv{text-align:right;font-size:12.5px}
.pgrow .rv b{display:block;font-variant-numeric:tabular-nums}

/* inline vendor cost — type straight into the table */
.vc{display:inline-flex;align-items:center;gap:2px;padding:6px 10px;border-radius:11px;background:var(--sunk);box-shadow:var(--in);cursor:text;transition:box-shadow .2s,background .2s;min-width:104px;justify-content:flex-end}
.vc b{color:var(--ink3);font-weight:600;font-size:12px}
.vc-in{width:76px;border:0;outline:none;background:transparent;text-align:right;font:600 13px var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink)}
.vc-in::placeholder{color:var(--warn);font-weight:700;opacity:.9}
.vc.empty{background:color-mix(in srgb,var(--warn) 12%,var(--sunk));box-shadow:var(--in),0 0 0 1.5px color-mix(in srgb,var(--warn) 35%,transparent)}
.vc:focus-within{box-shadow:var(--in),0 0 0 3px color-mix(in srgb,var(--acc2) 35%,transparent);background:var(--card-hi)}
.receipt .vc{padding:4px 8px;min-width:96px}

/* aging */
.agebar{display:flex;gap:4px;height:24px;border-radius:99px;padding:4px;background:var(--sunk);box-shadow:var(--in)}
.agebar i{min-width:8px;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--bc),#fff 32%),var(--bc) 55%,color-mix(in srgb,var(--bc),#000 12%));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 8px -3px var(--bc);transition:flex 1s var(--ease)}
.agegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.agegrid .mini{position:relative;overflow:hidden;padding-left:16px}
.agegrid .mini::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--bc)}
button.mini{cursor:pointer;transition:transform .25s var(--spring)}
button.mini:hover{transform:translateY(-2px)}
/* drop zone for Drive uploads */
.drop{display:flex;align-items:center;gap:12px;margin-top:8px;padding:13px 16px;border-radius:14px;background:var(--sunk);box-shadow:var(--in);color:var(--ink2);font-size:12.5px;cursor:pointer;transition:background .25s,box-shadow .25s,color .25s;outline:none}
.drop b{color:var(--ink)}
.drop:hover,.drop:focus-visible,.drop.over{background:color-mix(in srgb,var(--acc2) 12%,var(--sunk));box-shadow:var(--in),0 0 0 3px color-mix(in srgb,var(--acc2) 28%,transparent)}
.drop .svg-ic{width:22px;height:22px;color:var(--acc2);flex:none}
.drop.busy{animation:blink 1.1s infinite}
.drop.done{background:var(--good-bg);color:var(--good)}
.drop.done b{color:var(--good)}

/* responsive */
@media (max-width:1280px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:1fr 1fr}.g-3>:last-child{grid-column:1/-1}}
@media (max-width:980px){
  body{overflow:auto}
  .stage{padding:0;height:auto;min-height:100vh}
  .win{grid-template-columns:1fr;border-radius:0;min-height:100vh}

/* Alerts: derived live from data every render */

    if (st === 'approved' || st === 'partial') { const e = expected(inv), d = daysBetween(e, t); if (d > 0) out.push({ key: `pay:${inv.id}`, lvl: 'bad', sym: '◆', title: st === 'partial' ? `${money(balance(inv))} balance ${d} day${d > 1 ? 's' : ''} overdue` : `Payment ${d} day${d > 1 ? 's' : ''} overdue`, body: `${base} · expected ${fmtDate(e)}`, inv, acts: ['record', 'comm'] }); }

  });
  const noCost = live(S.invoices).filter(i => !num(i.vendorCost) && i.approval !== 'rejected');
  if (noCost.length) out.push({ key: `vc:${noCost.length}`, lvl: 'info', sym: '$', title: `${noCost.length} bill${noCost.length > 1 ? 's need' : ' needs'} a vendor cost`, body: 'Type what was paid to the vendor — profit updates instantly', acts: ['fillVc'] });
  live(S.reminders).filter(r => !r.done && !orphan(r) && r.date <= t && !(r.auto && (r.kind === 'approval' || r.kind === 'vendor' || (r.kind === 'payment' && r.date < t)))).forEach(r => {
    const d = daysBetween(r.date, t);
    out.push({ key: `rem:${r.id}`, lvl: d > 0 ? 'bad' : 'warn', sym: '☾', title: r.title, body: `${d > 0 ? `${d}d overdue` : 'Due today'}${r.time ? ' · ' + r.time : ''}${r.note ? ' · ' + r.note : ''}`, rem: r, inv: r.invoiceId ? invById(r.invoiceId) : null, acts: ['done', 'snoozeRem'] });

/* ---------- team sync (Google Apps Script web app) ---------- */

function setSaved(state, msg) {

  el.className = 'savepill' + (state === 'syncing' ? ' syncing' : state === 'err' ? ' err' : '');
  el.innerHTML = `<i></i><span>${msg || (state === 'syncing' ? 'Syncing' : state === 'err' ? 'Sync issue' : P.sync.url ? 'Synced' : 'Saved')}</span>`;

function scheduleSync() { if (!P.sync.url || !P.sync.auto) return; clearTimeout(_syncT); _syncT = setTimeout(() => syncNow(), 1800); }

  const m = new Map(); [...a, ...b].forEach(x => { if (!x || !x.id) return; const o = m.get(x.id); if (!o || (x.updatedAt || 0) > (o.updatedAt || 0)) m.set(x.id, x); });

function mergeRemote(R) {
  if (!R || typeof R !== 'object') return false;
  const before = JSON.stringify([S.invoices, S.expenses, S.reminders, S.settings]);
  S.invoices = mergeList(S.invoices, R.invoices); S.expenses = mergeList(S.expenses, R.expenses); S.reminders = mergeList(S.reminders, R.reminders);
  S.activity = mergeList(S.activity, R.activity).sort((a, b) => b.at - a.at).slice(0, 300);

const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' timed out — Google took too long, will retry')), ms))]);
async function syncNow(manual) {
  if (!P.sync.url) return;
  if (_syncing) { if (manual) toast({ kind: 'info', sym: '⟳', title: 'Already syncing…', ms: 2000 }); return; }
  _syncing = true; setSaved('syncing');
  const u = P.sync.url.trim(), k = encodeURIComponent(P.sync.key || '');
  try {
    const r = await withTimeout(fetch(`${u}${u.includes('?') ? '&' : '?'}key=${k}&t=${Date.now()}`, { method: 'GET', redirect: 'follow', cache: 'no-store' }), 30000, 'Download');
    const text = await r.text(); let remote;
    try { remote = JSON.parse(text); } catch (e) { throw new Error('The Google script did not answer with data — check the sync link'); }
    if (remote.error) throw new Error(remote.error);
    const changed = mergeRemote(remote);
    persist();
    const pr = await withTimeout(fetch(u, { method: 'POST', redirect: 'follow', body: JSON.stringify({ key: P.sync.key || '', data: { invoices: S.invoices, expenses: S.expenses, reminders: S.reminders, activity: S.activity.slice(0, 200), settings: S.settings, meta: S.meta, savedBy: P.user, savedAt: Date.now() } }) }), 60000, 'Upload');
    let pj = {}; try { pj = JSON.parse(await pr.text()); } catch (e) { pj = { ok: true }; /* sheet/calendar mirror may answer with HTML even when data saved */ }
    if (pj.error) throw new Error(pj.error);
    P.sync.last = Date.now(); P.sync.lastError = ''; savePrefs(); setSaved('ok');
    if (changed) { render(); watchAlerts(); }
    if (manual) toast({ kind: 'good', sym: '⟳', title: 'Team data synced', body: changed ? 'Pulled in your team\'s latest changes.' : 'Everything already matches.' });
  } catch (e) {
    P.sync.lastError = String(e.message || e).slice(0, 160); savePrefs(); setSaved('err');

  } finally { _syncing = false; }
}

/* ---------- upload a file to Google Drive through the Apps Script ---------- */
async function uploadToDrive(file, name, folder) {
  if (!P.sync.url) throw new Error('Connect Team sync in Settings to upload to Drive');
  if (file.size > 15 * 1024 * 1024) throw new Error('File is over 15 MB');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
  const resp = await fetch(P.sync.url.trim(), { method: 'POST', redirect: 'follow', body: JSON.stringify({ key: P.sync.key || '', action: 'upload', name, mime: file.type || 'application/pdf', data, folder }) });

/* ---------- sample-data purge ----------
   Older versions of the tracker shipped sample invoices. Any browser that still holds them
   would push them back into the shared data, so every copy now deletes them on sight
   (as synced deletions, so the removal spreads to everyone). */
const SAMPLE_CLIENTS = new Set(['Harbor Point REO', 'Keystone Servicing', 'Northgate Asset Mgmt', 'Sunline Properties', 'Maple Ridge Holdings', 'Cedar & Main Realty']);
const SAMPLE_REMINDERS = new Set(['Send November vendor payouts', 'Month-end review with Eric']);
const SAMPLE_CUTOFF = Date.parse('2026-11-17T12:00:00Z');
const SAMPLE_EXPENSES = { 'Pruvan subscription': 'Software & subscriptions', 'Shell': 'Fuel & mileage', 'Home Depot': 'Supplies', 'Wire & portal fees': 'Fees & bank charges' };
function purgeSample() {
  const now = Date.now(), kill = o => { o._del = true; o.updatedAt = now; n++; }; let n = 0;
  const dead = new Set();
  S.invoices.forEach(i => { if (SAMPLE_CLIENTS.has(i.client)) { dead.add(i.id); if (!i._del) kill(i); } });
  S.reminders.forEach(r => { if (!r._del && (dead.has(r.invoiceId) || SAMPLE_REMINDERS.has(r.title) || orphan(r))) kill(r); });
  S.activity.forEach(a => { if (!a._del && a.invoiceId && !(invById(a.invoiceId) && !invById(a.invoiceId)._del) && /^(logged|marked|confirmed|recorded|set |accepted|paid |uploaded)/.test(a.text || '')) kill(a); });
  S.activity.forEach(a => { if (!a._del && (dead.has(a.invoiceId) || [...SAMPLE_CLIENTS].some(c => (a.text || '').includes(c)) || /\bINV-1\d{3}\b/.test(a.text || ''))) kill(a); });
  /* expenses: exact sample payee + category, untouched, and created before this fix shipped */
  S.expenses.forEach(e => { if (!e._del && SAMPLE_EXPENSES[e.payee] === e.category && !e.invoiceId && !e.note && !e.receiptUrl && (e.updatedAt || 0) < SAMPLE_CUTOFF) kill(e); });
  return n;
}

/* ---------- WebGL shader background ---------- */
const Shader = (() => {

   float f=fbm(p+2.6*w);
   vec3 col=mix(c1,c2,smoothstep(.15,.85,f));
   col=mix(col,c3,smoothstep(.25,1.,length(q))*.75);
   col=mix(col,c4,smoothstep(.35,.95,w.y)*.55);
   float silk=smoothstep(.55,.9,f)*smoothstep(.2,.8,w.x);
   col+=silk*.10;
   col*=.82+.18*smoothstep(1.25,.15,length(uv-vec2(.5,.55)));
   col+=(h(gl_FragCoord.xy+fract(t*7.))-.5)*.035;
   gl_FragColor=vec4(col,1.);}`;
  const hex = h => { h = h.trim().replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  function init() {
    canvas = $('#shader');
    try { gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' }); } catch (e) {}
    if (!gl) { canvas.remove(); const d = document.createElement('div'); d.className = 'bgfallback'; document.body.prepend(d); return; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };

})();

function ring(pct, size = 150, stroke = 14, color = 'var(--acc2)', track = 'var(--sunk)') {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = clamp(pct, 0, 100), id = 'rg' + Math.random().toString(36).slice(2, 6);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="filter:drop-shadow(0 8px 10px rgba(var(--sh),.22))">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,${color},#fff 35%)"/><stop offset="1" style="stop-color:${color}"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" style="fill:none;stroke:${track}" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * p / 100} ${C}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dasharray 1s var(--ease)"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r - stroke / 2 - 4}" style="fill:none;stroke:rgba(255,255,255,.25)" stroke-width="1"/></svg>`;
}
function donut(segs, size = 170, label = '', sub = '') {
  const tot = sum(segs, s => s.v) || 1, r = size / 2 - 16, C = 2 * Math.PI * r, gap = segs.length > 1 ? 10 : 0; let off = 0;
  const arcs = segs.map((s, i) => { const len = Math.max(0, s.v / tot * C - gap); const a = `<circle class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" style="stroke:${s.c}" stroke-width="20" stroke-linecap="round" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})" data-tip="${esc(s.l)} · ${money(s.v, 0)} · ${(s.v / tot * 100).toFixed(0)}%"/>`; off += s.v / tot * C; return a; }).join('');
  return `<div class="ring-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="filter:drop-shadow(0 10px 12px rgba(var(--sh),.25))"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" style="stroke:var(--sunk)" stroke-width="20"/>${arcs}</svg>
    <div class="center"><b style="font-size:24px">${label}</b><small class="faint mono" style="font-size:10px">${sub}</small></div></div>`;
}
function barChart(months, h = 230) {

      ${th('stage', 'Seller approval')}<th>Payment received</th><th>Vendor paid</th>${th('lastComm', 'Last contact')}<th>Copy</th><th></th></tr></thead><tbody>

/* =================== AGING =================== */
let agingMode = 'recv', agingFocus = '';
const AGE_B = [[0, 30, '0–30 days', 'var(--good)'], [31, 60, '31–60', 'var(--t2i)'], [61, 90, '61–90', 'var(--warn)'], [91, 120, '91–120', 'var(--t4i)'], [121, 1e9, '120+', 'var(--bad)']];
function agingItems(mode) {
  const t = today();
  return live(S.invoices).map(i => {
    const age = Math.max(0, daysBetween(i.inputDate, t)), v = mode === 'recv' ? (i.paid || stage(i) === 'rejected' ? 0 : balance(i)) : vendorOwed(i);
    return { i, age, v, who: mode === 'recv' ? i.client : (i.vendor || 'Unassigned vendor'), b: AGE_B.findIndex(b => age >= b[0] && age <= b[1]) };
  }).filter(x => x.v > 0.004);
}
function pgAging() {
  const recv = agingMode === 'recv', items = agingItems(agingMode), tot = sum(items, x => x.v);
  const bt = AGE_B.map((b, k) => { const xs = items.filter(x => x.b === k); return { b, n: xs.length, v: sum(xs, x => x.v) }; });
  const groups = {}; items.forEach(x => { const g = groups[x.who] = groups[x.who] || { v: 0, b: [0, 0, 0, 0, 0], n: 0, oldest: 0 }; g.v += x.v; g.b[x.b] += x.v; g.n++; g.oldest = Math.max(g.oldest, x.age); });
  const rows = Object.entries(groups).sort((a, b) => b[1].v - a[1].v);
  const list = items.filter(x => !agingFocus || x.who === agingFocus).sort((a, b) => b.age - a.age);
  const avgAge = tot ? Math.round(sum(items, x => x.age * x.v) / tot) : 0;
  return `
  <div class="page-head"><div class="grow"><span class="kicker">Aging</span><h1 class="h1">${recv ? 'Who owes <em>you</em>' : 'Who <em>you owe</em>'}</h1>
    <p class="sub">${recv ? 'Every unpaid balance, grouped by how long ago it was billed. The older it gets, the harder it is to collect.' : 'Vendor and contractor costs not paid out yet, grouped by how long ago the job was billed.'}</p></div>
    <div class="row"><div class="seg"><button class="${recv ? 'on' : ''}" data-act="agingMode" data-m="recv">${ic('down')}Receivables</button><button class="${recv ? '' : 'on'}" data-act="agingMode" data-m="pay">${ic('up')}Owed to vendors</button></div>
    <button class="btn" data-act="csvAging">${ic('down')}CSV</button></div></div>
  <div class="card mt" style="position:relative">
    ${handNote(recv ? 'chase the red ones first' : 'pay the client-paid ones first', 'left:330px;top:40px;display:flex;align-items:center;gap:6px;flex-direction:row-reverse', 'left')}
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:16px">
      <div><div class="faint mono" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase">${recv ? 'Total outstanding' : 'Total owed to vendors'}</div><div style="font-family:var(--f-display);font-size:52px;line-height:1">${money(tot)}</div></div>
      <div class="row"><span class="chip">${items.length} bill${items.length === 1 ? '' : 's'}</span><span class="chip ${avgAge > 60 ? 'bad' : avgAge > 30 ? 'warn' : 'good'}">average ${avgAge} days old</span></div></div>
    <div class="agebar">${bt.filter(x => x.v).map(x => `<i style="flex:${x.v};--bc:${x.b[3]}" data-tip="${x.b[2]} · ${money(x.v, 0)}"></i>`).join('') || '<i style="flex:1;--bc:var(--good)"></i>'}</div>
    <div class="agegrid mt">${bt.map(x => `<div class="mini" style="--bc:${x.b[3]}"><small class="mono" style="color:${x.b[3]};font-weight:600">${x.b[2]}</small><b>${money(x.v, 0)}</b><small>${x.n} bill${x.n === 1 ? '' : 's'} · ${tot ? Math.round(x.v / tot * 100) : 0}%</small></div>`).join('')}</div>
  </div>
  <div class="card mt">
    <div class="card-head"><h3>By ${recv ? 'client' : 'vendor'}</h3><span class="sp"></span>${agingFocus ? `<button class="btn xs" data-act="agingFocus" data-w="">${ic('x')}Show all</button>` : '<span class="faint" style="font-size:11.5px">click a name to filter the list below</span>'}</div>
    ${rows.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:860px"><thead><tr><th>${recv ? 'Client' : 'Vendor'}</th>${AGE_B.map(b => `<th class="r">${b[2]}</th>`).join('')}<th class="r">Total</th><th class="r">Oldest</th></tr></thead><tbody>
      ${rows.map(([w, g]) => `<tr data-act="agingFocus" data-w="${esc(w)}" style="cursor:pointer${agingFocus === w ? ';filter:drop-shadow(0 0 0 transparent)' : ''}"><td><b>${esc(w)}</b><div class="faint" style="font-size:11px">${g.n} bill${g.n === 1 ? '' : 's'}</div></td>
        ${g.b.map((v, k) => `<td class="r num" style="${v ? `color:${AGE_B[k][3]}` : ''}">${v ? money(v, 0) : '<span class="faint">—</span>'}</td>`).join('')}<td class="r num"><b>${money(g.v, 0)}</b></td><td class="r"><span class="chip ${g.oldest > 90 ? 'bad' : g.oldest > 30 ? 'warn' : 'good'}">${g.oldest}d</span></td></tr>`).join('')}
      </tbody><tfoot><tr><td>Total</td>${bt.map(x => `<td class="r num">${x.v ? money(x.v, 0) : '—'}</td>`).join('')}<td class="r num">${money(tot, 0)}</td><td></td></tr></tfoot></table></div>`
      : emptyState(recv ? 'Nothing outstanding' : 'Every vendor is paid', recv ? 'Every bill is paid or closed.' : 'No contractor costs waiting to go out.')}
  </div>
  ${list.length ? `<div class="card mt"><div class="card-head"><h3>${agingFocus ? esc(agingFocus) : 'Oldest first'}</h3><span class="sp"></span><span class="faint mono" style="font-size:11px">${list.length} bill${list.length === 1 ? '' : 's'}</span></div>
    ${list.map(x => { const i = x.i, c = AGE_B[x.b][3]; return `<div class="up-item"><div class="datebox"><small style="color:${c}">days</small><b style="color:${c}">${x.age}</b></div>
      <div style="flex:1;min-width:0;cursor:pointer" data-act="open" data-id="${i.id}"><b style="font-size:13px">${esc(recv ? i.client : (i.vendor || 'Unassigned vendor'))}</b> <span class="faint mono" style="font-size:11px">${esc(i.no)}</span>
        <div class="faint" style="font-size:11.5px">${esc(i.service)} · ${recv ? `${STAGE[stage(i)][0]}${received(i) ? ` · ${money(received(i), 0)} received` : ''} · last contact ${rel(lastComm(i))}` : `${esc(i.client)} · ${i.paid ? '<span class="neg">client has paid</span>' : 'client not paid yet'}`}</div></div>
      <b class="mono" style="font-size:13px">${money(x.v)}</b>
      <div class="row" style="gap:4px;flex-wrap:nowrap">${recv ? `<button class="btn xs" data-act="logComm" data-id="${i.id}">${ic('chat')}Chase</button><button class="btn xs" data-act="payModal" data-id="${i.id}">${ic('check')}Payment</button>` : `<button class="btn xs" data-act="toggleVendor" data-id="${i.id}">${ic('check')}Mark paid</button>`}</div></div>`; }).join('')}</div>` : ''}`;
}
const dropZone = field => `<div class="drop" data-drop="${field}" tabindex="0" role="button">${ic('up')}<span>${P.sync.url ? '<b>Drop the PDF here</b> or click to choose — it is saved to your Google Drive and the link fills in' : '<b>Upload straight to Drive</b> — connect Team sync in Settings first (or paste a link above)'}</span></div>`;

/* =================== EXPENSES =================== */
function pgExpenses() {
  const k = expMonth || P.month, st = monthStats(k);
  const ex = st.ex.slice().sort((a, b) => b.date.localeCompare(a.date));
  const byCat = {}; st.ex.forEach(e => byCat[e.category || 'Other'] = (byCat[e.category || 'Other'] || 0) + num(e.amount));
  byCat['Vendor payouts'] = st.vendor;
  const segs = Object.entries(byCat).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(([l, v], i) => ({ l, v, c: PALETTE[i % PALETTE.length] }));
  const byVendor = {}; st.inv.forEach(i => { if (num(i.vendorCost)) { const v = byVendor[i.vendor || 'Unassigned'] = byVendor[i.vendor || 'Unassigned'] || { v: 0, n: 0, owed: 0 }; v.v += num(i.vendorCost); v.n++; v.owed += vendorOwed(i); } });
  const allOwed = live(S.invoices).filter(i => vendorOwed(i) > 0), owedClientPaid = allOwed.filter(i => i.paid);
  const vmax = Math.max(1, ...Object.values(byVendor).map(v => v.v)), totalOut = st.vendor + st.jobExtra + st.overhead;
  return `
  <div class="page-head"><div class="grow"><span class="kicker">Expenses</span><h1 class="h1">Where the <em>money goes</em></h1>
    <p class="sub">Vendor costs flow in from each invoice automatically. Add overhead here — or link a cost to a job and its profit updates itself.</p></div>
    <div class="row"><div class="seg"><button data-act="expMonth" data-d="-1">${ic('chevL')}</button><button class="on">${mLabel(k)}</button><button data-act="expMonth" data-d="1">${ic('chevR')}</button></div>
    <button class="btn" data-act="csvExp">${ic('down')}CSV</button><button class="btn primary" data-act="newExp">${ic('plus')}Add expense</button></div></div>
  <div class="grid g-kpi">
    ${tile({ bg: '--t3', ti: '--t3i', glyph: '◐', label: 'Vendor costs', value: st.vendor, foot: `${money(st.vendorPaidAmt, 0)} paid · ${money(st.vendorOwedAmt, 0)} still owed` })}
    ${tile({ bg: '--t4', ti: '--t4i', glyph: '⇄', label: 'Owed to vendors · all months', value: sum(allOwed, vendorOwed), chip: owedClientPaid.length ? `<span class="chip bad">${owedClientPaid.length} client-paid</span>` : '', foot: `${allOwed.length} job${allOwed.length === 1 ? '' : 's'} not paid out yet` })}
    ${tile({ bg: '--t1', ti: '--t1i', glyph: '◇', label: 'Overhead & job costs', value: st.overhead + st.jobExtra, foot: `${money(st.jobExtra, 0)} linked to specific jobs` })}
    ${tile({ bg: '--t2', ti: '--t2i', glyph: '∑', label: 'Total out', value: totalOut, foot: st.revenue ? `${(totalOut / st.revenue * 100).toFixed(0)}% of what was invoiced` : '' })}
  </div>
  <div class="grid g-2 mt">
    <div class="card">
      <div class="card-head"><h3>Overhead &amp; job costs</h3><span class="sp"></span><span class="faint mono" style="font-size:11px">${ex.length} entr${ex.length === 1 ? 'y' : 'ies'}</span></div>
      ${ex.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>Date</th><th>Category</th><th>Payee</th><th>Linked job</th><th class="r">Amount</th><th></th></tr></thead><tbody>
        ${ex.map(e => { const inv = e.invoiceId ? invById(e.invoiceId) : null; return `<tr><td class="mono" style="font-size:12px">${fmtDate(e.date)}</td><td><span class="chip">${esc(e.category)}</span></td><td><b>${esc(e.payee)}</b>${e.note ? `<div class="faint" style="font-size:11.5px">${esc(e.note)}</div>` : ''}</td>
          <td>${inv ? `<button class="chip info" data-act="open" data-id="${inv.id}">${esc(inv.no)} · ${esc(inv.client)}</button>` : '<span class="faint">overhead</span>'}</td><td class="r num">${money(num(e.amount))}</td>
          <td><div class="rowact">${e.receiptUrl ? `<a href="${esc(e.receiptUrl)}" target="_blank" rel="noopener" class="btn xs ghost">${ic('link')}</a>` : ''}<button data-act="editExp" data-id="${e.id}">${ic('edit')}</button><button data-act="delExp" data-id="${e.id}">${ic('trash')}</button></div></td></tr>`; }).join('')}
        </tbody></table></div>` : emptyState('No overhead logged', 'Fuel, software, supplies — add them so the month closes clean.', `<button class="btn primary" data-act="newExp">${ic('plus')}Add expense</button>`)}
    </div>
    <div>
      <div class="card"><div class="card-head"><h3>Spend mix</h3></div>
        ${segs.length ? `<div style="display:grid;place-items:center">${donut(segs, 190, compact(totalOut), 'total out')}</div><div style="margin-top:12px">${segs.map(s => `<div class="row" style="justify-content:space-between;padding:4px 0;font-size:12.5px"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${s.c};margin-right:7px"></i>${esc(s.l)}</span><b class="mono" style="font-size:11.5px">${money(s.v, 0)}</b></div>`).join('')}</div>` : emptyState('Nothing spent', '')}
      </div>
      <div class="card mt"><div class="card-head"><h3>Vendor payouts <span class="hint">from invoices</span></h3></div>
        ${Object.keys(byVendor).length ? Object.entries(byVendor).sort((a, b) => b[1].v - a[1].v).map(([n, v], i) => `<div class="lb-row"><span class="rk">0${i + 1}</span><div style="min-width:0"><div class="nm">${esc(n)}</div><div class="bar3d" style="--bc:${PALETTE[(i + 1) % PALETTE.length]}"><i style="width:${v.v / vmax * 100}%"></i></div></div><div style="text-align:right"><b class="mono" style="font-size:12.5px">${money(v.v, 0)}</b><div style="font-size:11px">${v.owed ? `<span class="neg">${money(v.owed, 0)} owed</span> <button class="btn xs" style="margin-left:4px" data-act="payVendorAll" data-v="${esc(n)}" data-k="${k}">Mark paid</button>` : '<span class="pos">all paid ✓</span>'}</div></div></div>`).join('') : emptyState('No vendor costs', '')}
      </div>
    </div>
  </div>`;
}

/* =================== MONTHLY REPORT =================== */
function pgReports() {
  const k = repMonth || P.month, st = monthStats(k), R = S.settings, isCur = k === curMonth(), closed = k < curMonth();
  const exp = isCur ? +today().slice(8) / daysInMonth(k) : 1;
  const track = [
    ['Invoiced', '◈', 't1', st.revenue, R.goalRevenue, true], ['Net profit', '✦', 't2', st.jobProfit, R.goalProfit, true],
    ['Collected', '◷', 't3', st.paidOfMonth, st.revenue, false], ['Seller approved', '✓', 't4', sum(st.inv.filter(i => i.approval === 'approved'), i => num(i.amount)), st.revenue, false], ['Vendors paid', '⇄', 't1', st.vendorPaidAmt, st.vendor, false],
  ];
  const jobs = st.inv.slice().sort((a, b) => profit(b) - profit(a)), pmax = Math.max(1, ...jobs.map(j => Math.abs(profit(j))));
  const yr = k.slice(0, 4), months12 = [...Array(12)].map((_, i) => Object.assign({ k: `${yr}-${pad(i + 1)}` }, monthStats(`${yr}-${pad(i + 1)}`)));
  const ytd = { r: sum(months12, m => m.revenue), p: sum(months12, m => m.jobProfit), n: sum(months12, m => m.net) };
  return `
  <div class="page-head"><div class="grow"><span class="kicker">Monthly report</span><h1 class="h1">${MONTHS[+k.slice(5) - 1]} <em>in numbers</em></h1>
    <p class="sub">Revenue, vendor costs and profit for every job logged in ${mLabel(k)} — per job and for the whole month.</p></div>
    <div class="row no-print"><div class="seg"><button data-act="repMonth" data-d="-1">${ic('chevL')}</button><button class="on">${mLabel(k)}</button><button data-act="repMonth" data-d="1">${ic('chevR')}</button></div>
    <button class="btn" data-act="print">${ic('print')}Print / PDF</button><button class="btn" data-act="csvMonth" data-k="${k}">${ic('down')}CSV</button></div></div>
  <div class="grid g-2">
    <div class="card">
      <div class="card-head"><h3>Am I on track?</h3><span class="sp"></span><span class="hint mono faint" style="font-size:11px">${isCur ? `marker = where you should be by today` : 'final numbers'}</span></div>
      ${track.map(([l, s, t, v, goal, isGoal]) => { const pct = goal ? v / goal * 100 : 0, should = goal * exp, diff = v - should;
        const chip = !goal ? '<span class="chip">no goal</span>' : isGoal ? (diff >= 0 ? `<span class="chip good">ahead by ${money(diff, 0)}</span>` : `<span class="chip warn">behind by ${money(-diff, 0)}</span>`) : `<span class="chip ${pct >= 80 ? 'good' : pct >= 50 ? 'warn' : 'bad'}">${pct.toFixed(0)}%</span>`;

/* =================== CALENDAR =================== */
function dayEvents(ds) {
  const out = [], t = today(), inv = live(S.invoices), rem = live(S.reminders).filter(r => !orphan(r));
  inv.filter(i => i.inputDate === ds).forEach(i => out.push({ cls: 'logged', label: `${i.client}`, tip: `Logged ${i.no} · ${money(num(i.amount))}`, inv: i }));
  inv.filter(i => i.paid && i.paidDate === ds).forEach(i => out.push({ cls: 'paid', label: `+${compact(profit(i))} ${i.client}`, tip: `Paid · ${i.no} · ${money(num(i.amount))}`, inv: i }));
  inv.filter(i => ['approved', 'partial'].includes(stage(i)) && expected(i) === ds && !rem.some(r => r.invoiceId === i.id && r.kind === 'payment' && !r.done))
    .forEach(i => out.push({ cls: ds < t ? 'over' : 'expected', label: `Due ${i.client}`, tip: `Payment expected · ${money(balance(i))}`, inv: i }));
  rem.filter(r => r.date === ds).forEach(r => out.push({ cls: (r.done ? 'rem done' : ds < t ? 'over' : 'rem'), label: `${r.time ? r.time + ' ' : ''}${r.title}`, tip: r.title + (r.note ? ' · ' + r.note : ''), rem: r }));
  return out;
}
function pgCalendar() {
  const k = P.calMonth, first = parse(k + '-01'), lead = first.getDay(), dim = daysInMonth(k), t = today();
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(first); d.setDate(1 - lead + i); const ds = iso(d), out = mKey(ds) !== k;
    if (i >= 35 && out && i % 7 === 0) break;
    const ev = dayEvents(ds);
    cells += `<button class="day ${out ? 'out' : ''} ${ds === t ? 'today' : ''} ${ev.length ? 'has-ev' : ''}" data-act="day" data-date="${ds}"><span class="dn">${d.getDate()}</span>
      ${ev.slice(0, 3).map(e => `<span class="ev ${e.cls}" data-tip="${esc(e.tip)}">${esc(e.label)}</span>`).join('')}${ev.length > 3 ? `<span class="ev more">+${ev.length - 3} more</span>` : ''}</button>`;
  }
  const ups = live(S.reminders).filter(r => !orphan(r)).filter(r => !r.done).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 10);
  return `
  <div class="page-head"><div class="grow"><span class="kicker">Calendar</span><h1 class="h1">${MONTHS[+k.slice(5) - 1]} <em>${k.slice(0, 4)}</em></h1>
    <p class="sub">Bills logged, payments due and every reminder — on one page. Send any of it to Google Calendar or Outlook in one click.</p></div>
    <div class="row"><div class="seg"><button data-act="calMonth" data-d="-1">${ic('chevL')}</button><button class="on" data-act="calMonth" data-d="0">Today</button><button data-act="calMonth" data-d="1">${ic('chevR')}</button></div>
      <button class="btn" data-act="calTips">${ic('sync')}Sync tips</button><button class="btn" data-act="icsAll">${ic('down')}Export .ics</button><button class="btn primary" data-act="newRem">${ic('plus')}Reminder</button></div></div>
  <div class="legend" style="margin-bottom:12px"><span><i style="background:var(--t1i)"></i>Invoice logged</span><span><i style="background:var(--warn)"></i>Payment expected</span><span><i style="background:var(--good)"></i>Paid</span><span><i style="background:var(--t3i)"></i>Reminder</span><span><i style="background:var(--bad)"></i>Overdue</span></div>
  <div class="card" style="padding:16px"><div class="cal">${'Sun Mon Tue Wed Thu Fri Sat'.split(' ').map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div>
  <div class="grid g-2 mt">
    <div class="card"><div class="card-head"><h3>Open reminders</h3><span class="sp"></span><span class="faint mono" style="font-size:11px">${live(S.reminders).filter(r => !orphan(r)).filter(r => !r.done).length} open</span></div>
      ${ups.length ? ups.map(r => remRow(r)).join('') : emptyState('No reminders', 'Automations add follow-ups as bills come in.')}</div>
    <div class="card"><div class="tape" style="top:-12px;right:40px;transform:rotate(4deg);--tc:var(--t2i)"></div>
      <div class="card-head"><h3>Suggested rhythms <span class="hint">one tap to add</span></h3></div>
      ${[['weekly', 'Monday approval sweep', 'Go through every bill awaiting seller approval', 1, '09:00'], ['weekly', 'Friday payment chase', 'Chase anything approved but unpaid', 5, '10:00'], ['monthly', 'Month-end close', 'Mark payments received, export the monthly report for Eric', 0, '16:00'], ['weekly', 'Upload invoice copies', 'Make sure every bill has its Drive link', 3, '15:00']]
        .map(([rep, title, note, dow, time]) => `<div class="up-item"><div class="ai-ic info" style="width:34px;height:34px;border-radius:12px;display:grid;place-items:center">⟳</div><div style="flex:1"><b style="font-size:13px">${title}</b><div class="faint" style="font-size:11.5px">${rep} · ${time} · ${note}</div></div>
          <button class="btn xs" data-act="addRhythm" data-rep="${rep}" data-title="${esc(title)}" data-note="${esc(note)}" data-dow="${dow}" data-time="${time}">${ic('plus')}Add</button></div>`).join('')}
    </div>
  </div>`;
}
function remRow(r) {
  const inv = r.invoiceId ? invById(r.invoiceId) : null, over = !r.done && r.date < today();
  return `<div class="up-item"><button class="sw ${r.done ? 'on' : ''}" data-act="remDone" data-id="${r.id}" aria-label="Done" style="transform:scale(.85)"></button>
    <div class="datebox"><small>${MONTHS[+r.date.slice(5, 7) - 1].slice(0, 3)}</small><b>${+r.date.slice(8)}</b></div>
    <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px;${r.done ? 'text-decoration:line-through;opacity:.55' : ''}">${esc(r.title)} ${r.repeat ? `<span class="chip info" style="font-size:10px">⟳ ${r.repeat}</span>` : ''}${r.auto ? '<span class="chip" style="font-size:10px">auto</span>' : ''}</div>
      <div class="faint" style="font-size:11.5px">${over ? `<span class="neg">overdue · </span>` : ''}${esc(r.time || '')} · ${esc(rel(r.date))}${r.note ? ' · ' + esc(r.note) : ''}${inv ? ` · <a href="#" data-act="open" data-id="${inv.id}">${esc(inv.no)}</a>` : ''}</div></div>
    <div class="row" style="gap:4px;flex-wrap:nowrap"><a class="btn xs ghost" href="${gcalUrl({ ...r, desc: r.note })}" target="_blank" rel="noopener" data-tip="Google Calendar">G</a><a class="btn xs ghost" href="${outlookUrl({ ...r, desc: r.note })}" target="_blank" rel="noopener" data-tip="Outlook">O</a>
      <button class="btn xs ghost" data-act="ics1" data-id="${r.id}" data-tip="Download .ics (Apple / any app)">${ic('down')}</button><button class="btn xs ghost" data-act="editRem" data-id="${r.id}">${ic('edit')}</button></div></div>`;
}
