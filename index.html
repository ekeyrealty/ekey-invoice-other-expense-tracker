const APPS_SCRIPT = "/**\n * EKEY REALTY \u2726 invoice tracker team sync \u2014 Google Apps Script\n * ------------------------------------------------------------\n * What it does\n *   1. Stores the shared tracker data in one JSON file in your Google Drive\n *   2. Mirrors every invoice / expense / month into tabs of THIS Google Sheet\n *   3. Puts every open reminder on a shared Google Calendar (\"Ekey Realty reminders\")\n *      with a 15-minute pop-up, and removes it when it's marked done\n *   4. Saves uploaded invoice PDFs / receipts into a Drive folder, one sub-folder per month\n *\n * Setup (5 minutes)\n *   a. Create a Google Sheet (e.g. \"Invoice Tracker \u2014 live\").\n *   b. Extensions \u2192 Apps Script \u2192 paste this whole file \u2192 change SECRET below.\n *   c. Project Settings (gear) \u2192 set the Time zone to yours.\n *   d. Deploy \u2192 New deployment \u2192 type \"Web app\"\n *        Execute as: Me      Who has access: Anyone\n *      Authorize when asked, then copy the URL that ends in /exec.\n *   e. In the tracker \u2192 Settings \u2192 Team sync: paste the URL and the same SECRET.\n *      Your coworker pastes the same two values on her computer.\n *   f. Share the \"Ekey Realty reminders\" calendar with your coworker in Google Calendar\n *      (it appears after the first sync that has a reminder).\n *   g. Share the \"Ekey Realty \u2014 invoice copies\" Drive folder with your coworker once\n *      (it appears after the first upload), so she can open every PDF.\n *\n * Updating this script later: Deploy \u2192 Manage deployments \u2192 pencil icon \u2192\n * Version: \"New version\" \u2192 Deploy. The /exec URL stays the same.\n */\n\nconst SECRET = 'change-me-to-a-long-random-phrase';\nconst DATA_FILE = 'ekey-realty-tracker-data.json';\nconst CALENDAR_NAME = 'Ekey Realty reminders';   // set to '' to switch calendar automation off\nconst COPIES_FOLDER_ID = '';                 // optional: paste the ID of an existing Drive folder for invoice copies\nconst COPIES_FOLDER_NAME = 'Ekey Realty \u2014 invoice copies';   // used when COPIES_FOLDER_ID is blank\n\nfunction doGet(e) {\n  if ((e.parameter.key || '') !== SECRET) return json_({ error: 'unauthorized' });\n  const text = file_().getBlob().getDataAsString() || '{}';\n  return ContentService.createTextOutput(text).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction doPost(e) {\n  let body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return json_({ error: 'bad json' }); }\n  if ((body.key || '') !== SECRET) return json_({ error: 'unauthorized' });\n  if (body.action === 'upload') return upload_(body);\n  const data = body.data;\n  if (!data || typeof data !== 'object' || !Array.isArray(data.invoices)) return json_({ error: 'no tracker data in request' });\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    file_().setContent(JSON.stringify(data));\n    mirrorSheet_(data);\n    if (CALENDAR_NAME) syncCalendar_(data);\n  } finally {\n    lock.releaseLock();\n  }\n  return json_({ ok: true, at: Date.now() });\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction file_() {\n  const props = PropertiesService.getScriptProperties();\n  const id = props.getProperty('FILE_ID');\n  if (id) { try { return DriveApp.getFileById(id); } catch (e) {} }\n  const f = DriveApp.createFile(DATA_FILE, '{}', 'application/json');\n  props.setProperty('FILE_ID', f.getId());\n  return f;\n}\n\n/* ---------- invoice PDF / receipt uploads ---------- */\nfunction upload_(body) {\n  if (!body.data) return json_({ error: 'no file' });\n  const root = copiesFolder_();\n  const month = String(body.folder || '').replace(/[^0-9-]/g, '');\n  let target = root;\n  if (month) { const it = root.getFoldersByName(month); target = it.hasNext() ? it.next() : root.createFolder(month); }\n  const blob = Utilities.newBlob(Utilities.base64Decode(body.data), body.mime || 'application/pdf', String(body.name || 'invoice.pdf').slice(0, 180));\n  const f = target.createFile(blob);\n  return json_({ ok: true, url: f.getUrl(), id: f.getId() });\n}\nfunction copiesFolder_() {\n  if (COPIES_FOLDER_ID) return DriveApp.getFolderById(COPIES_FOLDER_ID);\n  const props = PropertiesService.getScriptProperties(), id = props.getProperty('COPIES_ID');\n  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }\n  const it = DriveApp.getFoldersByName(COPIES_FOLDER_NAME), folder = it.hasNext() ? it.next() : DriveApp.createFolder(COPIES_FOLDER_NAME);\n  props.setProperty('COPIES_ID', folder.getId());\n  return folder;\n}\n\n/* ---------- Google Sheet mirror ---------- */\nfunction mirrorSheet_(d) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  if (!ss) return;\n  const inv = (d.invoices || []).filter(i => !i._del).sort((a, b) => String(b.inputDate || '').localeCompare(String(a.inputDate || '')));\n  const exp = (d.expenses || []).filter(x => !x._del);\n  const extra = id => exp.filter(x => x.invoiceId === id).reduce((t, x) => t + (+x.amount || 0), 0);\n  const recv = i => { const p = (i.payments || []).filter(x => !x._del); return p.length ? p.reduce((t, x) => t + (+x.amount || 0), 0) : (i.paid ? (+i.amount || 0) : 0); };\n  const lastComm = i => { const c = (i.comms || []).filter(x => !x.sys).map(x => x.date).sort(); return c.length ? c[c.length - 1] : i.inputDate; };\n\n  const rows = [['Invoice #', 'Input date', 'Client', 'Property', 'Type of service', 'Invoicing system', 'Amount invoiced', 'Amount received', 'Short-pay', 'Vendor', 'Vendor cost', 'Vendor paid', 'Net profit', 'Seller approval', 'Payment received', 'Paid date', 'Last communication', 'Invoice copy', 'Entered by', 'Month']];\n  inv.forEach(i => {\n    const r = recv(i), short = i.paid ? Math.max(0, (+i.amount || 0) - r) : 0;\n    const p = (i.paid ? r : (+i.amount || 0)) - (+i.vendorCost || 0) - extra(i.id);\n    rows.push([i.no || '', i.inputDate || '', i.client || '', i.property || '', i.service || '', i.system || '', +i.amount || 0, r, short, i.vendor || '', +i.vendorCost || 0, i.vendorPaid ? 'Yes' : 'No', p,\n      i.approval || 'pending', i.paid ? 'Yes' : 'No', i.paidDate || '', lastComm(i) || '', i.copyUrl || '', i.enteredBy || '', String(i.inputDate || '').slice(0, 7)]);\n  });\n  write_(ss, 'Invoices', rows);\n\n  const er = [['Date', 'Category', 'Payee', 'Amount', 'Linked invoice', 'Note']];\n  exp.forEach(x => er.push([x.date || '', x.category || '', x.payee || '', +x.amount || 0, (inv.find(i => i.id === x.invoiceId) || {}).no || '', x.note || '']));\n  write_(ss, 'Expenses', er);\n\n  const m = {};\n  const row = k => (m[k] = m[k] || { n: 0, r: 0, v: 0, o: 0 });\n  inv.forEach(i => { const o = row(String(i.inputDate || '').slice(0, 7)); o.n++; o.r += (i.paid ? recv(i) : (+i.amount || 0)); o.v += (+i.vendorCost || 0) + extra(i.id); });\n  exp.filter(x => !x.invoiceId).forEach(x => { row(String(x.date || '').slice(0, 7)).o += +x.amount || 0; });\n  const mr = [['Month', 'Invoices', 'Invoiced (less short-pays)', 'Vendor & job costs', 'Job profit', 'Overhead', 'Monthly net']];\n  Object.keys(m).sort().reverse().forEach(k => { const o = m[k]; mr.push([k, o.n, o.r, o.v, o.r - o.v, o.o, o.r - o.v - o.o]); });\n  write_(ss, 'Monthly', mr);\n}\n\nfunction write_(ss, name, rows) {\n  const sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clearContents();\n  sh.getRange(1, 1, rows.length, rows[0].length).setValues(rows);\n  sh.setFrozenRows(1);\n  sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold');\n}\n\n/* ---------- Google Calendar automation ---------- */\nfunction syncCalendar_(d) {\n  const cal = CalendarApp.getCalendarsByName(CALENDAR_NAME)[0] || CalendarApp.createCalendar(CALENDAR_NAME);\n  const props = PropertiesService.getScriptProperties();\n  const map = JSON.parse(props.getProperty('EVENT_MAP') || '{}');\n  const since = +(props.getProperty('CAL_SINCE') || 0);\n  const yesterday = Utilities.formatDate(new Date(Date.now() - 864e5), Session.getScriptTimeZone(), 'yyyy-MM-dd');\n\n  (d.reminders || []).forEach(r => {\n    const evId = map[r.id];\n    if ((r.updatedAt || 0) <= since && evId) return;              // unchanged\n    if (r._del || r.done) {\n      if (evId) { try { cal.getEventById(evId).deleteEvent(); } catch (e) {} delete map[r.id]; }\n      return;\n    }\n    if (!evId && r.date < yesterday) return;                       // don't back-fill old ones\n    const [y, mo, da] = r.date.split('-').map(Number);\n    const [h, mi] = (r.time || '09:00').split(':').map(Number);\n    const start = new Date(y, mo - 1, da, h, mi), end = new Date(start.getTime() + 30 * 60000);\n    const desc = (r.note || '') + '\\n\u2014 from the Ekey Realty invoice tracker';\n    if (evId) {\n      try { const ev = cal.getEventById(evId); if (ev) { ev.setTitle(r.title); ev.setTime(start, end); ev.setDescription(desc); return; } } catch (e) {}\n    }\n    const ev = cal.createEvent(r.title, start, end, { description: desc });\n    ev.removeAllReminders(); ev.addPopupReminder(15);\n    map[r.id] = ev.getId();\n  });\n  props.setProperty('EVENT_MAP', JSON.stringify(map));\n  props.setProperty('CAL_SINCE', String(Date.now()));\n}\n";

/* ---------- toasts ---------- */
function toast({ kind = 'info', sym = '✦', title, body = '', action, ms = 6500 }) {
  const host = $('#toasts'), C = { good: 'var(--good)', bad: 'var(--bad)', warn: 'var(--warn)', info: 'var(--acc3)' };
  while (host.children.length >= 4) host.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.style.setProperty('--tc', C[kind] || C.info);
  el.innerHTML = `<div class="ti">${sym}</div><div style="min-width:0;padding-right:20px"><b>${esc(title)}</b>${body ? `<p>${esc(body)}</p>` : ''}${action ? `<div class="tacts"><button class="btn xs primary">${esc(action[0])}</button></div>` : ''}</div>
    <button class="tx" aria-label="Dismiss">${ic('x')}</button><div class="prog"><i style="animation-duration:${ms}ms"></i></div>`;
  const bye = () => { if (!el.isConnected) return; el.classList.add('bye'); setTimeout(() => el.remove(), 340); };
  let timer = setTimeout(bye, ms);
  el.onmouseenter = () => { clearTimeout(timer); el.querySelector('.prog i').style.animationPlayState = 'paused'; };
  el.onmouseleave = () => { timer = setTimeout(bye, 2500); };
  el.querySelector('.tx').onclick = bye;
  if (action) el.querySelector('.tacts button').onclick = () => { action[1](); bye(); };
  host.appendChild(el);
}
function burst(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'burst'; s.textContent = ['✦', '✧', '·', '✶'][i % 4];
    const a = Math.PI * 2 * i / n + Math.random() * .5, d = 40 + Math.random() * 60;
    s.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;color:${['var(--acc2)', 'var(--good)', 'var(--acc3)', 'var(--t3i)'][i % 4]};font-size:${10 + Math.random() * 10}px`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 1100);
  }
}
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

function pickFile(target) { const inp = $('#uploadFile'); inp._target = target; inp.value = ''; inp.click(); }
async function handleUpload(file, tgt) {
  if (!file || !tgt) return;
  if (!P.sync.url) { toast({ kind: 'warn', sym: '!', title: 'Connect Team sync first', body: 'Uploads go to your Google Drive through the Apps Script. Settings → Team sync.', action: ['Open settings', () => { closeModal(); closeDrawer(); go('settings'); }] }); return; }
  let name, folder = curMonth(), setUrl, zone = tgt.invId ? null : tgt;
  if (tgt.invId) {
    const inv = invById(tgt.invId); name = `${inv.no} - ${inv.client} - ${file.name}`; folder = mKey(inv.inputDate);
    setUrl = url => { inv.copyUrl = url; sysNote(inv, `Invoice copy uploaded — ${file.name}`); log(`uploaded the invoice copy for ${inv.no}`, 'comm', inv.id); touch(inv); commit(); };
  } else {
    const f = zone.closest('form'), field = zone.dataset.drop, dt = f.inputDate || f.date;
    name = `${f.client ? `${f.no.value} - ${f.client.value || 'invoice'}` : `receipt - ${f.payee ? f.payee.value : ''}`} - ${file.name}`; if (dt && dt.value) folder = mKey(dt.value);
    setUrl = url => { f[field].value = url; updatePreview(f); };
    zone.classList.add('busy'); zone.querySelector('span').innerHTML = `<b>Uploading ${esc(file.name)}…</b>`;
  }
  toast({ kind: 'info', sym: '↑', title: 'Uploading to Google Drive', body: file.name, ms: 2500 });
  try {
    const url = await uploadToDrive(file, name.replace(/[\\/:*?"<>|]+/g, ' ').slice(0, 150), folder); setUrl(url);
    if (zone && zone.isConnected) { zone.classList.remove('busy'); zone.classList.add('done'); zone.querySelector('span').innerHTML = `<b>✓ ${esc(file.name)}</b> saved to Drive — link filled in`; }
    toast({ kind: 'good', sym: '✓', title: 'Saved to Google Drive', body: `Filed under ${folder}` });
  } catch (err) {
    if (zone && zone.isConnected) { zone.classList.remove('busy'); zone.querySelector('span').innerHTML = '<b>Upload failed</b> — try again or paste a link'; }
    toast({ kind: 'bad', sym: '!', title: 'Upload failed', body: String(err.message || err).slice(0, 140) });
  }
}

function updatePreview(f) {
  if (!f || f.dataset.form !== 'invoice') return;
  const a = num(f.amount.value), v = num(f.vendorCost.value), R = S.settings.rules, paidF = f.paid.value === '1';
  const rec = paidF ? (f.received.value.trim() === '' ? a : num(f.received.value)) : a, spv = paidF ? Math.max(0, a - rec) : 0, p = rec - v, m = rec ? p / rec * 100 : 0;
  $('#pvSRow').style.display = spv ? '' : 'none'; $('#pvS').textContent = money(spv);
  $('#pvA').textContent = money(a); $('#pvV').textContent = money(v); const pp = $('#pvP'); pp.textContent = money(p); pp.className = p < 0 ? 'neg' : 'pos';
  $('#pvRing').innerHTML = `<div class="ring-wrap">${ring(Math.max(0, m), 110, 11, p < 0 ? 'var(--bad)' : m < R.lowMargin ? 'var(--warn)' : 'var(--good)')}<div class="center"><b style="font-size:24px">${a ? m.toFixed(0) : '–'}<small style="font-size:12px">%</small></b><small class="faint" style="font-size:10px">margin</small></div></div>`;
  const ap = f.approval.value, paid = f.paid.value === '1', d = f.inputDate.value || today(), n = [];
  if (paid) n.push('✓ Locked in as paid — reminders close'); else if (ap === 'approved') n.push(`☾ Payment reminder on ${fmtDate(f.expectedDate.value || addDays(today(), R.paymentDays))}`);
  else if (ap === 'pending' && R.autoFollowup) n.push(`☾ Approval check on ${fmtDate(addDays(d, R.approvalDays))}`); else if (ap === 'rejected') n.push('↺ Resubmit reminder in 2 days');
  if (spv) n.push(`◒ Short-pay of ${money(spv)} flagged`);
  if (paid && v && f.vendorPaid.value !== '1') n.push('⇄ Pay-vendor reminder in 2 days');
  if (!f.copyUrl.value && R.missingCopy) n.push('◇ Flagged until the copy is attached');
  if (a && p < 0) n.push('▼ Losing-money alert'); else if (a && m < R.lowMargin) n.push(`◇ Thin-margin alert (< ${R.lowMargin}%)`);
  n.push('✦ Dashboard, report & calendar update');
  $('#pvNext').innerHTML = n.map(x => `<div>${esc(x)}</div>`).join('');
}

const FORMS = {

    if (settled) { inv.paid = true; inv.paidDate = date; }
    automateInvoice(inv, prev);
    if (!settled) { sysNote(inv, `Partial payment — ${money(a)} · ${money(balance(inv))} still due`); log(`recorded a partial payment on ${inv.no} · ${money(a)}`, 'paid', inv.id); }
    touch(inv); closeModal(); commit();

    toast(settled ? { kind: sp ? 'warn' : 'good', sym: sp ? '◒' : '✓', title: sp ? `Closed with a ${money(sp)} short-pay` : `Paid in full · ${money(received(inv))}`, body: `${inv.client} — ${money(profit(inv))} profit` }

  },

    if (!inv) { inv = { id: uid(), comms: [], createdAt: Date.now() }; S.invoices.push(inv); }

    const p = profit(inv);
    toast({ kind: p < 0 ? 'bad' : 'good', sym: prev ? '✓' : '✦', title: prev ? `Saved ${inv.no}` : `Logged ${inv.no} · ${money(inv.amount)}`, body: `${inv.client} — ${money(p)} profit (${margin(inv).toFixed(0)}%)${!prev && S.settings.rules.autoFollowup && stage(inv) === 'pending' ? ` · approval check ${fmtDate(addDays(inv.inputDate, S.settings.rules.approvalDays))}` : ''}`, action: ['Open', () => openInvoice(inv.id)] });
    if (inv.paid && (!prev || !prev.paid)) burst(innerWidth / 2, innerHeight / 2, 18);
    setTimeout(() => { const r = $('#row-' + inv.id); if (r) { r.classList.add('flash'); r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }, 80);
  },
  expense: f => {
    const fd = Object.fromEntries(new FormData(f)), id = f.dataset.id; let e = id ? S.expenses.find(x => x.id === id) : null;
    if (!e) { e = { id: uid() }; S.expenses.push(e); }
    Object.assign(e, { date: fd.date, amount: num(fd.amount), category: fd.category, payee: fd.payee.trim(), invoiceId: fd.invoiceId, receiptUrl: fd.receiptUrl.trim(), note: fd.note.trim() }); touch(e);
    log(`${id ? 'updated' : 'added'} ${e.category.toLowerCase()} expense · ${money(e.amount)}`, 'expense', e.invoiceId); closeModal(); commit();
    const inv = e.invoiceId && invById(e.invoiceId);
    toast({ kind: 'good', sym: '◇', title: `Expense saved · ${money(e.amount)}`, body: inv ? `${inv.no} profit is now ${money(profit(inv))}` : `Counted as ${mShort(mKey(e.date))} overhead` });
  },
  reminder: f => {
    const fd = Object.fromEntries(new FormData(f)), id = f.dataset.id; let r = id ? S.reminders.find(x => x.id === id) : null;
    if (r) { Object.assign(r, { title: fd.title, date: fd.date, time: fd.time, note: fd.note, invoiceId: fd.invoiceId, repeat: fd.repeat }); touch(r); delete P.notified[r.id]; }
    else r = addReminder({ title: fd.title, date: fd.date, time: fd.time, note: fd.note, invoiceId: fd.invoiceId, repeat: fd.repeat });
    log(`set a reminder: “${r.title}”`, 'reminder', r.invoiceId); closeModal(); commit();
    toast({ kind: 'good', sym: '☾', title: 'Reminder set', body: `${fmtLong(r.date)} · ${r.time}`, action: ['Add to Google Calendar', () => window.open(gcalUrl({ ...r, desc: r.note }), '_blank')] });
  },
  quickRem: f => { const fd = Object.fromEntries(new FormData(f)); addReminder({ title: fd.title, date: f.dataset.date, time: fd.time }); commit(); dayModal(f.dataset.date); toast({ kind: 'good', sym: '☾', title: 'Reminder added', body: fd.title }); },
  comm: f => {
    const fd = Object.fromEntries(new FormData(f)), inv = invById(f.dataset.id);
    (inv.comms = inv.comms || []).push({ id: uid(), date: fd.date || today(), note: fd.note.trim(), by: P.user, at: Date.now() });
    if (fd.follow) addReminder({ date: addDays(fd.date || today(), +fd.follow), title: `Follow up · ${inv.client}`, note: fd.note.trim().slice(0, 80), invoiceId: inv.id, kind: 'custom' });
    touch(inv); log(`logged contact on ${inv.no}`, 'comm', inv.id); if (f.dataset.modal) closeModal(); commit();
    toast({ kind: 'good', sym: '❍', title: 'Communication logged', body: `${inv.client}${fd.follow ? ` · follow-up in ${fd.follow} days` : ''}` });
  },
};

/* ---------- theme ---------- */
function applyTheme() {
  const r = document.documentElement; r.dataset.theme = P.theme; r.dataset.mode = P.mode; savePrefs();
  Shader.readColors(); renderTop(); if (P.page === 'settings') render();
  let m = $('meta[name=theme-color]'); if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = getComputedStyle(r).getPropertyValue('--g1').trim();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const cmd = e.target.closest('[data-cmd]'); if (cmd) return runCmd(+cmd.dataset.cmd);
  if (e.target.matches('[data-scrim]')) { closeModal(); return; }
  const dz = e.target.closest('[data-drop]'); if (dz) { if (!P.sync.url) return handleUpload({}, dz); return pickFile(dz); }
  if (e.target.closest('.vc, .vc-in')) return;
  const el = e.target.closest('[data-act]');
  if ($('#pop') && !e.target.closest('#pop') && !(el && ['themePop', 'notifs'].includes(el.dataset.act))) closePop();
  if (!el) { if ($('#drawer') && !e.target.closest('#drawer,#overlay,.toast')) closeDrawer(); return; }
  if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href') !== '#') { e.stopPropagation(); return; }
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('input', e => {
  const t = e.target, f = t.closest('form[data-form=invoice]'); if (f) updatePreview(f); if (t.closest('form[data-form=payment]')) payHint();
  if (t.dataset.live === 'invQ') { invQ = t.value; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.vc) {   /* inline vendor cost — type it, press Enter or Tab, done */
    const inv = invById(t.dataset.vc); if (!inv) return; const v = num(t.value), was = num(inv.vendorCost);
    if (v === was) return;
    inv.vendorCost = v; touch(inv); log(`set vendor cost on ${inv.no} to ${money(v)}`, 'expense', inv.id);
    setTimeout(() => { commit(); toast({ kind: profit(inv) < 0 ? 'bad' : 'good', sym: '$', title: `Vendor cost saved · ${money(v)}`, body: `${inv.no} — profit now ${money(profit(inv))} (${margin(inv).toFixed(0)}%)`, ms: 3500 }); }, 0);
    return;
  }
  if (t.matches('[data-cat]')) { const f = t.closest('form'), subs = CATEGORIES[t.value] || [], sel = f.subCategory;
    sel.innerHTML = `<option value="">${subs.length ? 'Unassigned' : '— none for this category —'}</option>` + subs.map(s => `<option>${esc(s)}</option>`).join(''); sel.disabled = !subs.length; return; }
  if (t.dataset.pref) { const path = t.dataset.pref.split('.'); let o = P; while (path.length > 1) o = o[path.shift()]; o[path[0]] = t.value.trim(); savePrefs();
    if (t.dataset.pref === 'user') { log('started logging', 'info'); commit({ quiet: true }); toast({ kind: 'info', sym: '◉', title: `Hi ${P.user}`, body: 'New entries will be signed with your name.', ms: 3000 }); }
    else if (t.dataset.pref.startsWith('sync')) { if (P.sync.url && P.sync.key) syncNow(true); }
    else render(); return; }
  if (t.dataset.set) { const path = t.dataset.set.split('.'); let o = S.settings; while (path.length > 1) o = o[path.shift()];
    o[path[0]] = ['goalProfit', 'goalRevenue'].includes(path[0]) || t.dataset.set.startsWith('rules.') ? num(t.value) : t.value.trim();
    S.settings.updatedAt = Date.now(); commit(); toast({ kind: 'good', sym: '✓', title: 'Saved', ms: 1800 }); }
  if (t.closest('form[data-form=invoice]')) updatePreview(t.closest('form'));
});
document.addEventListener('keydown', e => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (t.dataset && t.dataset.vc && e.key === 'Enter') { e.preventDefault(); const all = $$('.vc-in'), i = all.indexOf(t); t.blur(); if (all[i + 1]) all[i + 1].focus(); else t.dispatchEvent(new Event('change', { bubbles: true })); return; }
  if (t.dataset && t.dataset.tagadd !== undefined && e.key === 'Enter') { e.preventDefault(); const v = t.value.trim(); if (v) { const l = S.settings[t.dataset.tagadd]; if (!l.includes(v)) l.push(v); S.settings.updatedAt = Date.now(); t.value = ''; commit(); setTimeout(() => { const n = $(`[data-tagadd="${t.dataset.tagadd}"]`); if (n) n.focus(); }, 0); } return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { const f = $('#overlay form'); if (f) { e.preventDefault(); f.requestSubmit(); } return; }
  if ($('#cmdIn') && t.id === 'cmdIn') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); _cmdSel = clamp(_cmdSel + (e.key === 'ArrowDown' ? 1 : -1), 0, _cmdItems.length - 1); drawCmd(t.value); $(`[data-cmd="${_cmdSel}"]`)?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); runCmd(_cmdSel); }
  }
  if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeModal(); else if ($('#pop')) closePop(); else if ($('#drawer')) closeDrawer(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || $('#overlay').innerHTML) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); invoiceModal(); } else if (k === 'e') { e.preventDefault(); expenseModal(); } else if (k === 'r') { e.preventDefault(); reminderModal(); } else if (k === '/') { e.preventDefault(); openCmd(); }
});
/* drag & drop uploads */
document.addEventListener('dragover', e => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (dz) { e.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', e => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest && e.target.closest('[data-drop]'); if (!dz) return; e.preventDefault(); dz.classList.remove('over'); handleUpload(e.dataTransfer.files[0], dz); });
$('#uploadFile').addEventListener('change', e => { const f = e.target.files[0], t = e.target._target; e.target._target = null; handleUpload(f, t); });
/* tooltips */
const tipEl = () => $('#tip');
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); const tp = tipEl(); if (!el) { tp.classList.remove('on'); return; } const r = el.getBoundingClientRect(); tp.textContent = el.dataset.tip; tp.style.left = (r.left + r.width / 2) + 'px'; tp.style.top = r.top + 'px'; tp.classList.add('on'); });
document.addEventListener('scroll', () => tipEl().classList.remove('on'), true);
/* 3D tilt on tiles */
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return; const t = e.target.closest('.tile');
  $$('.tile.tilting').forEach(x => { if (x !== t) { x.classList.remove('tilting'); x.style.setProperty('--rx', '0deg'); x.style.setProperty('--ry', '0deg'); } });
  if (!t) return; const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  t.classList.add('tilting'); t.style.setProperty('--ry', ((x - .5) * 9).toFixed(2) + 'deg'); t.style.setProperty('--rx', ((.5 - y) * 9).toFixed(2) + 'deg'); t.style.setProperty('--mx', x * 100 + '%'); t.style.setProperty('--my', y * 100 + '%');
});
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data.invoices) throw new Error('Not a tracker backup file');
    mergeRemote(data); commit(); toast({ kind: 'good', sym: '↑', title: 'Backup restored', body: `${live(S.invoices).length} invoices on file` });
  } catch (err) { toast({ kind: 'bad', title: 'Could not import', body: err.message }); }
  e.target.value = '';
});
window.addEventListener('storage', e => { if (e.key === KEY) { load(); render(); } });

/* ---------- boot ---------- */
load();
function applyInvite() {
  const m = location.hash.match(/^#sync=([\w-]+)/); if (!m) return false;
  P.sync.url = `https://script.google.com/macros/s/${m[1]}/exec`; P.sync.key = ''; P.sync.auto = true; P.sync.lastError = ''; savePrefs();
  history.replaceState(null, '', location.pathname); return true;
}
let _joined = applyInvite();
addEventListener('hashchange', () => { if (applyInvite()) { toast({ kind: 'good', sym: '⟳', title: 'Connected to your team', body: 'Pulling the shared invoices now…', ms: 5000 }); render(); syncNow(); } });
const h = location.hash.slice(1); if (NAV.some(n => n[0] === h)) P.page = h;
if (P.month !== curMonth() && P.month < shiftMonth(curMonth(), -12)) P.month = curMonth();
document.documentElement.dataset.theme = P.theme; document.documentElement.dataset.mode = P.mode;
Shader.init(); applyTheme(); render();
setTimeout(() => { watchAlerts(true); tickReminders(); }, 1400);
if (_joined) toast({ kind: 'good', sym: '⟳', title: 'Connected to your team', body: 'Pulling the shared invoices now…', ms: 5000 });
if (!P.user) setTimeout(() => openModal(`${mHead('Welcome', 'Who’s logging?')}<p class="muted" style="margin-top:0">Pick your name — everything you add is signed with it. You can switch any time at the bottom of the sidebar.</p>
  <div class="row">${S.settings.team.map(t => `<button class="btn" data-act="pickUser" data-u="${esc(t)}"><span class="avatar" style="width:24px;height:24px;font-size:11px">${esc(t[0])}</span>${esc(t)}</button>`).join('')}</div>`, 'narrow'), 600);
setInterval(tickReminders, 30000);
setInterval(() => { renderSide(); renderTop(); }, 5 * 60000);
setInterval(() => { if (P.sync.url && P.sync.auto && !document.hidden) syncNow(); }, 90000);
if (P.sync.url) setTimeout(() => syncNow(), 800);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickReminders(); if (P.sync.url && P.sync.auto) syncNow(); } });

</script>
</body>
</html>
